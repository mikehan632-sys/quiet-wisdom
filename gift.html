<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>赠一句 · A line for you — 静悟 Quiet Wisdom</title>
<!--
  赠一句 — the gift landing page.

  ⛔ EVERYTHING ARRIVES IN THE URL FRAGMENT (#), NEVER THE QUERY STRING. A fragment is not sent to
  the server, so the quote and the sender's note never reach GitHub Pages' access logs. legal/
  privacy.html §4 promises exactly that. Moving these to ?query= would silently make the privacy
  policy false. See DeepLink.swift for the matching note on the Swift side.

  ⛔ ONLY THE FREE LAYER IS EVER RENDERED — the line and its pinyin. Never the meaning, origin or
  application. In the app a gifted line opens completely because only a subscriber can send one;
  a web URL can be posted publicly, where that gate does not hold.

  ⚠️ The quote travels in the URL rather than being looked up here, so this page has no copy of
  lines.json, can never drift from it, and renders lines written after it was published.
-->
<style>
  :root{
    --paper:#EDE7DA; --paper-raised:#F5F1E7; --ink:#3A3428; --ink-soft:#6B6253;
    --gold:#A8894F; --rule:#D6CDB9;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#1C1A16; --paper-raised:#262219; --ink:#E8E1D2; --ink-soft:#A79D8A;
      --gold:#C4A467; --rule:#3A352B;
    }
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:"Songti SC","Noto Serif SC","Source Han Serif SC",Georgia,"Times New Roman",serif;
    -webkit-font-smoothing:antialiased;
    display:flex; align-items:center; justify-content:center; min-height:100vh; padding:40px 16px;
  }
  .sheet{width:100%; max-width:560px; text-align:center}
  .brand{font-size:15px; letter-spacing:.32em; color:var(--gold); margin-bottom:6px}
  .slogan{font-size:12px; letter-spacing:.18em; color:var(--ink-soft); margin-bottom:38px}
  .from{font-size:13px; color:var(--ink-soft); margin-bottom:22px}
  /* The moon gate — the app's own frame for a line. */
  .gate{
    border:1.5px solid var(--gold); border-radius:150px 150px 10px 10px;
    background:var(--paper-raised); padding:52px 30px 40px; margin-bottom:26px;
  }
  .quote{font-size:25px; line-height:1.85; margin:0}
  .pinyin{font-size:12.5px; letter-spacing:.06em; color:var(--ink-soft); margin:20px 0 0; font-style:italic}
  .note{
    background:var(--paper-raised); border-left:2px solid var(--gold);
    padding:16px 20px; margin:0 0 30px; text-align:left;
    font-size:15px; line-height:1.75; color:var(--ink-soft); white-space:pre-wrap; word-break:break-word;
  }
  .note b{display:block; font-size:11px; letter-spacing:.2em; color:var(--gold); margin-bottom:8px; font-weight:400}
  .actions{display:flex; flex-direction:column; gap:12px; align-items:stretch}
  a.btn, span.btn{
    display:block; padding:14px 20px; border-radius:40px; text-decoration:none;
    font-size:14.5px; letter-spacing:.04em;
  }
  a.primary{background:var(--gold); color:var(--paper-raised)}
  a.ghost{border:1px solid var(--rule); color:var(--ink-soft)}
  span.soon{border:1px dashed var(--rule); color:var(--ink-soft); font-size:13px}
  .foot{margin-top:34px; font-size:11.5px; color:var(--ink-soft); line-height:1.9}
  .foot a{color:var(--ink-soft)}
  .en{font-size:12px; opacity:.72; display:block; margin-top:3px; letter-spacing:.02em}
</style>
</head>
<body>
<div class="sheet">
  <div class="brand">静悟</div>
  <div class="slogan">静而后悟 · QUIET WISDOM</div>
  <div id="content"></div>
  <div class="foot">
    <span id="privacyNote"></span><br>
    <a href="privacy.html">隐私政策 · Privacy Policy</a>
  </div>
</div>

<script>
// ⛔ null until the app is actually on the App Store. A placeholder URL that 404s is exactly the
// mistake `LegalLinks.privacy` shipped for a month — the page adapts instead of lying.
const APP_STORE_URL = null;

const esc = s => s.replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// The payload is in location.hash, so it never left the sender's device via our server.
const p = new URLSearchParams(location.hash.slice(1));
const line = p.get('line'), quote = p.get('q'), pinyin = p.get('py'), note = p.get('note');

const el = document.getElementById('content');

if (!quote) {
  // No payload — someone opened the page directly. Say what it is rather than showing a broken card.
  el.innerHTML = `
    <div class="gate"><p class="quote">一句，送给你。<span class="en">A line, sent to you.</span></p></div>
    <p class="note">这个页面用来打开朋友赠你的句子。<span class="en">This page opens a line a
    friend has sent you. The link they share will show it here.</span></p>`;
} else {
  const appLink = 'jingwu://gift?line=' + encodeURIComponent(line || '') +
                  (note ? '&note=' + encodeURIComponent(note) : '');
  el.innerHTML = `
    <div class="from">有人赠你一句 <span class="en">Someone sent you a line</span></div>
    <div class="gate">
      <p class="quote">${esc(quote)}</p>
      ${pinyin ? `<p class="pinyin">${esc(pinyin)}</p>` : ''}
    </div>
    ${note ? `<p class="note"><b>他们写道 · THEIR NOTE</b>${esc(note)}</p>` : ''}
    <div class="actions">
      <a class="btn primary" href="${esc(appLink)}">在 静悟 中打开<span class="en">Open in Quiet Wisdom</span></a>
      ${APP_STORE_URL
        ? `<a class="btn ghost" href="${APP_STORE_URL}">下载 静悟<span class="en">Get the app — read what it means</span></a>`
        : `<span class="btn soon">静悟 即将上架 App Store<span class="en">Quiet Wisdom is coming to the App Store</span></span>`}
    </div>`;
}

// Stated on the page because it is unusual and it is the reason the design is shaped this way.
document.getElementById('privacyNote').innerHTML =
  '这句话与留言只存在于这条链接里，我们的服务器从未收到。' +
  '<span class="en">The line and note live only in this link — they are never sent to our server.</span>';
</script>
</body>
</html>
